name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # 固定完整版本号, 让每次 CI 使用同一版安装工具
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Test (pytest)
        run: >-
          uv run pytest -v --cov=quanttoolkit --cov-branch
          --cov-report=term-missing --cov-report=xml
          --cov-report=html --cov-report=markdown-append:$GITHUB_STEP_SUMMARY

      - name: Save coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error

      - name: Build package
        run: uv build
