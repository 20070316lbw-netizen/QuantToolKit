[project]
name = "quanttoolkit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "20070316lbw-netizen", email = "lbw20070316lbw@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "loguru>=0.7.3",
    "lxml>=6.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "torch>=2.14.1",
]

[project.scripts]
quanttoolkit = "quanttoolkit:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
